name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff && ruff check dags tests
      - name: DAG integrity test (Airflow version matches Astro Runtime 3.1-13)
        run: |
          AF=3.1.7
          pip install "apache-airflow==${AF}" pytest apache-airflow-providers-snowflake \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AF}/constraints-3.12.txt"
          pytest tests -q
