# Repo secrets needed: ASTRO_API_TOKEN, ASTRO_DEPLOYMENT_ID
# Deploys on every push to main (after you've set the secrets). Switch to workflow_dispatch to keep it manual.
name: Deploy to Astronomer
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ASTRO_API_TOKEN: ${{ secrets.ASTRO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astronomer/deploy-action@v0.10
        with:
          deployment-id: ${{ secrets.ASTRO_DEPLOYMENT_ID }}
